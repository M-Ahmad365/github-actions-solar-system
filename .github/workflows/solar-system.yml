name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:

  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Doing Cache
          uses: actions/cache@v6.0.0
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          
        - name: Install Dependencies
          run: npm install
      
        - name: Debug Environment Variables
          run: |
            node -e 'console.log("URI available:", !!process.env.MONGO_URI)'
            node -e 'console.log("Username available:", !!process.env.MONGO_USERNAME)'
            node -e 'console.log("Password available:", !!process.env.MONGO_PASSWORD)'
            
        - name: Check MongoDB Connection
          run: |
            node -e '
              const mongoose = require("mongoose");
              mongoose.connect(process.env.MONGO_URI, {
                user: process.env.MONGO_USERNAME,
                pass: process.env.MONGO_PASSWORD,
                useNewUrlParser: true,
                useUnifiedTopology: true,
                serverSelectionTimeoutMS: 10000
              }).then(async () => {
                console.log("MongoDB connection successful");
                await mongoose.disconnect();
              }).catch(err => {
                console.error(err.message);
                process.exit(1);
              });
            '
            
        
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
